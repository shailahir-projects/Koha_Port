spring.application.name=koha-java-admin
server.port=8085

# PostgreSQL datasource
spring.datasource.url=jdbc:postgresql://localhost:5432/koha
spring.datasource.username=koha
spring.datasource.password=koha
spring.datasource.driver-class-name=org.postgresql.Driver

# JSON date format
spring.jackson.serialization.write-dates-as-timestamps=false
