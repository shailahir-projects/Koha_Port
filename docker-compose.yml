version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: koha
      POSTGRES_USER: koha_user
      POSTGRES_PASSWORD: koha_pass
    ports:
      - '5432:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U koha_user -d koha"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  koha-java-database:
    build: ./koha-java-database
    ports:
      - '8076:8076'
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/koha
      SPRING_DATASOURCE_USERNAME: koha_user
      SPRING_DATASOURCE_PASSWORD: koha_pass
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8076/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
  koha-java-opac-gateway:
    build: ./koha-java-opac-gateway
    ports:
      - '8079:8079'
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/koha
