      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/koha
      SPRING_DATASOURCE_USERNAME: koha_user
      SPRING_DATASOURCE_PASSWORD: koha_pass
      SPRING_LIQUIBASE_ENABLED: 'false'
    depends_on:
      - koha-java-database
  koha-java-patron:
