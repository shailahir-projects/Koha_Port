server:
  port: 8079
spring:
  liquibase:
    enabled: false
  application:
    name: koha-java-opac-gateway
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
      routes:
        - id: catalog
          uri: http://localhost:8094
          predicates:
            - Path=/api/v1/biblios/**,/api/v1/items/**,/api/v1/authorities/**
        - id: auth
          uri: http://localhost:8095
          predicates:
            - Path=/api/v1/auth/**,/api/v1/oauth/**
        - id: patron
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/patrons/**
        # We assume Docker or Kubernetes DNS handles lb:// mapping
        # but locally we'll map to localhost for simplicity right now
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
