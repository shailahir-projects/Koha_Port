apiVersion: apps/v1
kind: Deployment
metadata:
  name: koha-java-holds
  namespace: koha
spec:
  replicas: 2
  selector:
    matchLabels:
      app: koha-java-holds
  template:
    metadata:
      labels:
        app: koha-java-holds
    spec:
      containers:
        - name: koha-java-holds
          image: shailahir/koha-java-holds:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: koha-java-holds-config
          ports:
            - containerPort: 8080
          resources:
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
